<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>智元机器人面试作战室</title><style>body{margin:0;background:#06111f;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:28px}small{color:#98a9bd}</style></head><body><div class="box">正在加载面试作战室…<br><small>AGIBOT Interview Playbook</small></div><script>(async()=>{try{const fs=['data1.txt','data2.txt','data3.txt','data4.txt','data5.txt'],ps=await Promise.all(fs.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error(f);return r.text()}))),b=ps.join(''),u=Uint8Array.from(atob(b),c=>c.charCodeAt(0)),s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip')),t=await new Response(s).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="box">页面加载失败，请刷新或使用系统浏览器打开。</div>'}})();</script></body></html>
